[project]
name = "pojok-literasi"
version = "0.1.0"
description = "Sistem konten Instagram Pojok Literasi: data lokal, dashboard web, dan MCP server untuk agent AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
pojok-literasi-mcp = "pojok_literasi.mcp_server:main"
pojok-literasi-web = "pojok_literasi.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pojok_literasi"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
